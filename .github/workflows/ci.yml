# Builds and tests the game-free Core of every mod. Plugin projects and the .sln are never built here:
# they reference BepInEx/interop assemblies generated by the game, which CI does not have.
# A new mod is picked up automatically by following the mods/<Name>/<Name>.Core[.Tests]/ layout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Single job, stable name: branch protection requires the "check" context.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # global.json pins 10.0.201 with rollForward latestFeature; tests target net10.0, so no 6.0 runtime.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # setup-dotnet's built-in cache needs packages.lock.json, which the repo does not use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Discover Core projects
        run: |
          shopt -s nullglob
          core=(mods/*/*.Core/*.Core.csproj)
          tests=(mods/*/*.Core.Tests/*.Core.Tests.csproj)
          if (( ${#core[@]} == 0 || ${#tests[@]} == 0 )); then
            echo "::error::No mods/<Name>/<Name>.Core[.Tests] projects found"
            exit 1
          fi
          printf 'CORE_PROJECTS=%s\n' "${core[*]}" >> "$GITHUB_ENV"
          printf 'TEST_PROJECTS=%s\n' "${tests[*]}" >> "$GITHUB_ENV"
          printf 'Core: %s\nTests: %s\n' "${core[*]}" "${tests[*]}"

      - name: Build Core
        run: for p in $CORE_PROJECTS; do dotnet build "$p" -c Release; done

      - name: Test Core
        run: for p in $TEST_PROJECTS; do dotnet test "$p" -c Release; done

      - name: Verify formatting
        run: for p in $CORE_PROJECTS $TEST_PROJECTS; do dotnet format "$p" --verify-no-changes --no-restore; done
